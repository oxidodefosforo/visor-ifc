# Publica una versión nueva del instalador cuando se sube una etiqueta vX.Y.Z.
#   npm version patch      (0.2.0 -> 0.2.1; crea el commit y la etiqueta v0.2.1)
#   git push --follow-tags
# GitHub compila en Windows, ejecuta la prueba con el IFC real y, si pasa,
# crea la Release con Visor-IFC-Setup-X.Y.Z.exe + latest.yml + .blockmap.
# Los programas ya instalados la detectan al abrirse y se actualizan solos.
name: Publicar versión

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (versiones fijadas)
        run: npm ci

      - name: Comprobar que la etiqueta coincide con package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json=$v, etiqueta=${GITHUB_REF_NAME}"; exit 1; }

      - name: Compilar
        run: npm run build

      - name: Prueba con IFC real
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Crear instalador y publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VISOR_GH_OWNER: ${{ github.repository_owner }}
          VISOR_GH_REPO: ${{ github.event.repository.name }}
        run: npx electron-builder --win --x64 --config electron-builder.config.cjs --publish always

      - name: Guardar resultados de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

# Publica una versión nueva del instalador de Windows en GitHub Releases.
#
# Se ejecuta cuando:
#   - se sube a main un cambio de package.json (p. ej. tras `npm version patch --no-git-tag-version`),
#   - se sube una etiqueta vX.Y.Z,
#   - o se lanza a mano (Actions → Publicar versión → Run workflow).
# Si la Release vX.Y.Z ya está completa, no hace nada. Si no:
# compila en Windows, ejecuta la prueba con el IFC real y publica
# Visor-IFC-Setup-X.Y.Z.exe + .blockmap + latest.yml (este último es el que leen
# los programas instalados para actualizarse).
name: Publicar versión

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # crear la Release y subir archivos

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "v$V" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con package.json ($V)"; exit 1
          fi
          if gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "La Release v$V ya está publicada y completa: nada que hacer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (versiones fijadas)
        if: steps.v.outputs.skip != 'true'
        run: npm ci

      - name: Compilar
        if: steps.v.outputs.skip != 'true'
        run: npm run build

      - name: Prueba con IFC real
        if: steps.v.outputs.skip != 'true'
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Crear instalador
        if: steps.v.outputs.skip != 'true'
        env:
          VISOR_GH_OWNER: ${{ github.repository_owner }}
          VISOR_GH_REPO: ${{ github.event.repository.name }}
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --config electron-builder.config.cjs --publish never 2>&1 | tee builder.log || {
            tail -n 25 builder.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          ls -la release
          for f in "release/Visor-IFC-Setup-${{ steps.v.outputs.version }}.exe" "release/Visor-IFC-Setup-${{ steps.v.outputs.version }}.exe.blockmap" release/latest.yml; do
            [ -f "$f" ] || { echo "::error::Falta $f"; exit 1; }
          done
          echo "::notice::latest.yml => $(tr '\n' ' ' < release/latest.yml)"

      - name: Publicar Release
        if: steps.v.outputs.skip != 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          FILES=("release/Visor-IFC-Setup-$V.exe" "release/Visor-IFC-Setup-$V.exe.blockmap" release/latest.yml)
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "${FILES[@]}" --clobber
          else
            gh release create "v$V" "${FILES[@]}" --target "$GITHUB_SHA" --title "Visor IFC $V" \
              --notes "Instalador de Windows. Los programas ya instalados se actualizarán automáticamente."
          fi
          gh release view "v$V" --json assets -q '.assets[].name' | tee assets.txt
          grep -qx latest.yml assets.txt || { echo "::error::latest.yml no quedó publicado"; exit 1; }
          echo "::notice::Publicado v$V: $(tr '\n' ' ' < assets.txt)"

      - name: Guardar resultados de la prueba
        if: always() && steps.v.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
